<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Projetos</title>
<meta name="description" content="Índice dos meus projetos publicados, com link para abrir e copiar.">
<style>
  :root{--bg:#f4f6fb;--card:#fff;--txt:#1b2333;--mut:#5d6882;--brand:#2f6df6;--brand2:#e8efff;--bd:#e1e6f0;--ok:#16a34a}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#182033;--txt:#e9eefb;--mut:#9aa7c4;--brand:#6c9bff;--brand2:#22305a;--bd:#2a3550;--ok:#4ade80}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{padding:40px 16px 8px;text-align:center}
  h1{margin:0 0 6px;font-size:clamp(1.6rem,5vw,2.2rem)}
  header p{margin:0;color:var(--mut)}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  #busca{width:100%;padding:12px 14px;font-size:1rem;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--txt);margin:8px 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
  .ico{font-size:2rem;line-height:1}
  .card h2{margin:0;font-size:1.1rem}
  .card p{margin:0;color:var(--mut);font-size:.93rem;flex:1}
  .tag{align-self:flex-start;font-size:.75rem;background:var(--brand2);color:var(--brand);padding:3px 9px;border-radius:99px}
  .acoes{display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;min-width:90px;text-align:center;text-decoration:none;cursor:pointer;font:inherit;font-size:.9rem;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--txt)}
  .btn.main{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.ok{border-color:var(--ok);color:var(--ok)}
  .vazio{text-align:center;color:var(--mut);padding:30px;display:none}
  footer{text-align:center;color:var(--mut);font-size:.8rem;padding:24px 16px 40px}
</style>
</head>
<body>
<header>
  <h1>📚 Meus Projetos</h1>
  <p>Tudo que está publicado, num lugar só. Toque em <b>Copiar link</b> para compartilhar só aquele projeto.</p>
</header>
<main class="wrap">
  <input id="busca" type="search" placeholder="Buscar projeto…" aria-label="Buscar projeto">
  <div id="lista" class="grid"></div>
  <div id="vazio" class="vazio">Nenhum projeto encontrado.</div>
</main>
<footer><span id="total"></span> · Para adicionar um projeto novo, inclua uma linha na lista dentro do <code>index.html</code>.</footer>

<script>
// ===== LISTA DE PROJETOS (edite aqui para adicionar/remover) =====
const BASE = "https://marcelokielwagen.github.io/";
const GH = "https://github.com/marcelokielwagen/";
const projetos = [
  {icone:"🌤️", nome:"Bom Dia", tag:"Dia a dia", pasta:"bom-dia",
   desc:"Previsão do tempo de Blumenau e Balneário Camboriú, frase do dia e notícias."},
  {icone:"🎮", nome:"Jogos Offline", tag:"Jogos", pasta:"JogosOffline",
   desc:"Jogos clássicos que funcionam offline no celular."},
  {icone:"🎰", nome:"Gerador de Bolão", tag:"Loteria", pasta:"gerador-de-bolao",
   desc:"Gerador de bolão para Mega-Sena e Lotofácil."},
  {icone:"🧾", nome:"Calculadora de Rescisão", tag:"Finanças", pasta:"calculadora-de-rescisao",
   desc:"Rescisão trabalhista (CLT) com INSS, IR 2026, FGTS e multa."},
  {icone:"📈", nome:"Juros Compostos", tag:"Finanças", pasta:"calculadora-juros-compostos",
   desc:"Calculadora de juros compostos estilo Excel."}
];

const lista = document.getElementById("lista");
const vazio = document.getElementById("vazio");

function copiar(texto){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texto);
  return new Promise((ok, erro) => {
    const t = document.createElement("textarea");
    t.value = texto; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy") ? ok() : erro(); } catch(e){ erro(e); }
    t.remove();
  });
}

projetos.forEach(p => {
  const url = BASE + p.pasta + "/";
  const el = document.createElement("article");
  el.className = "card";
  el.dataset.busca = (p.nome + " " + p.desc + " " + p.tag).toLowerCase();
  el.innerHTML = `
    <div class="ico">${p.icone}</div>
    <span class="tag">${p.tag}</span>
    <h2>${p.nome}</h2>
    <p>${p.desc}</p>
    <div class="acoes">
      <a class="btn main" href="${url}" target="_blank" rel="noopener">Abrir</a>
      <button class="btn" type="button">Copiar link</button>
      <a class="btn" href="${GH}${p.pasta}" target="_blank" rel="noopener">Código</a>
    </div>`;
  const b = el.querySelector("button");
  b.addEventListener("click", () => {
    copiar(url).then(() => {
      b.textContent = "✓ Copiado!"; b.classList.add("ok");
      setTimeout(() => { b.textContent = "Copiar link"; b.classList.remove("ok"); }, 1800);
    }).catch(() => { prompt("Copie o link:", url); });
  });
  lista.appendChild(el);
});

document.getElementById("total").textContent = projetos.length + " projetos";
document.getElementById("busca").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let n = 0;
  lista.querySelectorAll(".card").forEach(c => {
    const mostra = c.dataset.busca.includes(q);
    c.style.display = mostra ? "" : "none";
    if (mostra) n++;
  });
  vazio.style.display = n ? "none" : "block";
});
</script>
</body>
</html>
